<style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#141e33;--panel2:#1b2942;--text:#f6f8ff;--muted:#9aabc5;--accent:#72e1ad;--border:#293753}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(circle at 15% 0%,#1a3044 0%,transparent 35%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}header{max-width:1100px;margin:auto;padding:24px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:24px;font-weight:850;letter-spacing:-1px}.logo span{color:var(--accent)}.pill{font-size:13px;color:var(--accent);background:#173a35;border:1px solid #24534b;padding:8px 13px;border-radius:50px}main{max-width:1100px;margin:auto;padding:22px 20px 70px}.hero{padding:22px 0 28px}.hero h1{font-size:clamp(30px,5vw,49px);letter-spacing:-1.8px;line-height:1.12;margin:0 0 10px}.hero p{color:var(--muted);margin:0;line-height:1.7}.toolbar{display:flex;align-items:center;gap:14px;margin:18px 0 22px}.search{width:100%;padding:14px 17px;border-radius:14px;background:var(--panel);color:white;border:1px solid var(--border);outline:none}.search:focus{border-color:var(--accent)}.count{color:var(--muted);white-space:nowrap;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.game-card{border:1px solid var(--border);background:var(--panel);color:inherit;text-align:left;border-radius:20px;padding:14px;transition:transform .15s,border-color .15s}.game-card:hover,.game-card:focus-visible{transform:translateY(-4px);border-color:var(--accent)}.art{height:135px;border-radius:14px;display:grid;place-items:center;font-size:64px;margin-bottom:15px}.art.snake{background:linear-gradient(135deg,#1d6b54,#0b3d3d)}.art.tic{background:linear-gradient(135deg,#51387a,#2d264a)}.art.memory{background:linear-gradient(135deg,#7a4e25,#422b25)}.art.click{background:linear-gradient(135deg,#2c588a,#1c294c)}.game-card strong{display:block;font-s nd:linear-gradient(135deg,#2f4665,#20344e)}.memory-board button.matched{background:#1d5848;border-color:#54aa82}.target{height:250px;max-width:440px;margin:20px auto;border:2px dashed #49627b;border-radius:20px;display:grid;place-items:center;background:#0c1b2d}.target button{border:0;background:#66dfad;color:#06251b;border-radius:50%;width:95px;height:95px;font-size:38px;box-shadow:0 0 0 12px #66dfad22}.target button:active{transform:scale(.94)}footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 20px 30px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:1fr}.art{height:120px}.game-layout{padding:16px}.hero{padding-top:7px}header{padding-bottom:5px}.pill{font-size:11px}.game-card{display:grid;grid-template-columns:100px 1fr;column-gap:14px;align-items:center}.art{grid-row:span 3;height:100px;margin:0;font-size:50px}.game-card small{margin:4px 0}.game-card strong{font-size:17px}}
.duel{display:flex;justify-content:center;align-items:center;gap:clamp(14px,5vw,45px);margin:24px auto;text-align:center}.duel-hand{font-size:clamp(60px,11vw,105px);transform-origin:center bottom}.duel-hand.mirrored{transform:scaleX(-1)}.duel-hand.shaking{animation:handshake .3s ease-in-out infinite alternate}.duel-hand.mirrored.shaking{animation:handshake-mirror .3s ease-in-out infinite alternate}@keyframes handshake{from{transform:rotate(-20deg) translateY(-8px)}to{transform:rotate(18deg) translateY(7px)}}@keyframes handshake-mirror{from{transform:scaleX(-1) rotate(-20deg) translateY(-8px)}to{transform:scaleX(-1) rotate(18deg) translateY(7px)}}@media(prefers-reduced-motion:reduce){.duel-hand.shaking,.duel-hand.mirrored.shaking{animation:none}}</style>

<body><header><div class="logo">▶ Play<span>Hub</span></div><div class="pill">✓ 100 % kostenlos</div></header>
<main><section id="home" class="screen active"><div class="hero"><h1>Deine Spiele. <span style="color:var(--accent)">Dein Spaß.</span></h1><p>Such dir ein Spiel aus und leg direkt los. Ohne Anmeldung, ohne Werbung, ohne Installation.</p></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="🔎  Spiele suchen ..." aria-label="Spiele suchen"><span class="count" id="gameCount">12 Spiele</span></div><div class="grid" id="games"><button class="game-card" data-game="snake"><span class="art snake">🐍</span><strong>Snake</strong><small>Sammle Äpfel und werde länger.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="tic"><span class="art tic">⭕</span><strong>Tic Tac Toe</strong><small>Fordere den Computer heraus.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="memory"><span class="art memory">🧠</span><strong>Memory</strong><small>Finde alle passenden Paare.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="click"><span class="art click">⚡</span><strong>Click Challenge</strong><small>Wie viele Klicks in 10 Sekunden?</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="guess"><span class="art" style="background:linear-gradient(135deg,#344c75,#18263c)">🔢</span><strong>Zahlenraten</strong><small>Errate die geheime Zahl von 1 bis 100.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="rps"><span class="art" style="background:linear-gradient(135deg,#344c75,#18263c)">✊</span><strong>Schere Stein Papier</strong><small>Fordere den Computer heraus.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="reaction"><span class="art" style="background:linear-gradient(135deg,#344c75,#18263c)">🎯</span><strong>Reaktionstest</strong><small>Wie schnell reagierst du?</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="math"><span class="art" style="background:linear-gradient(135deg,#344c75,#18263c)">🧮</span><strong>Mathe Blitz</strong><small>Löse Aufgaben gegen die Zeit.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="whack"><span class="art" style="background:linear-gradient(135deg,#344c75,#18263c)">🐹</span><strong>Maulwurf-Jagd</strong><small>Triff die Maulwürfe in 30 Sekunden.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="color"><span class="art" style="background:linear-gradient(135deg,#344c75,#18263c)">🎨</span><strong>Farben-Match</strong><small>Erkenne die richtige Farbe.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="car"><span class="art" style="background:linear-gradient(135deg,#25436d,#111e34)">🏎️</span><strong>Auto-Ausweichen</strong><small>Weiche dem Verkehr aus und sammle Punkte.</small><span class="play-link">Jetzt spielen →</span></button><button class="game-card" data-game="words"><span class="art" style="background:linear-gradient(135deg,#3d326c,#1a1934)">🔤</span><strong>Wörter erraten</strong><small>Errate das Wort in maximal 7 Fehlversuchen.</small><span class="play-link">Jetzt spielen →</span></button></div><p id="noResults"' class="muted" hidden>Kein Spiel gefunden.</p></section>
<section id="play" class="screen"><button class="back" id="back">← Alle Spiele</button><div class="game-layout" id="gameArea"></div></section></main><footer>PlayHub · Kostenlos spielen · Made for fun 🎮</footer>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),home=$('#home'),play=$('#play'),area=$('#gameArea');let cleanup=()=>{};const search=$('#search');search.addEventListener('input',()=>{let n=0;document.querySelectorAll('.game-card').forEach(c=>{const ok=c.textContent.toLowerCase().includes(search.value.toLowerCase());c.hidden=!ok;if(ok)n++});$('#gameCount').textContent=n+' Spiele';$('#noResults').hidden=n!==0});function open(id){cleanup();cleanup=()=>{};home.classList.remove('active');play.classList.add('active');window.scrollTo(0,0);({snake,tic,memory,click,guess,rps,reaction,math,whack,color,car,words})[id]()}function back(){cleanup();cleanup=()=>{};play.classList.remove('active');home.classList.add('active');area.innerHTML=''}document.querySelectorAll('[data-game]').forEach(c=>c.onclick=()=>open(c.dataset.game));$('#back').onclick=back;function shell(title,desc,body){area.innerHTML=`<h2>${title}</h2><p class="muted">${desc}</p>${body}`}
function snake(){shell('🐍 Snake','Steuerung: Pfeiltasten / WASD oder Buttons auf dem Handy.',`<div class="stats"><div class="stat">Punkte: <b id="score">0</b></div><div class="stat">Rekord: <b id="best">0</b></div></div><canvas id="snakeCanvas" width="400" height="400" aria-label="Snake Spielfeld"></canvas><div class="dpad"><span></span><button data-dir="up" aria-label="Hoch">▲</button><span></span><button data-dir="left" aria-label="Links">◀</button><button data-dir="down" aria-label="Runter">▼</button><button data-dir="right" aria-label="Rechts">▶</button></div><p class="muted" id="snakeStatus">Drücke Start, um zu spielen.</p><div class="actions"><button class="primary" id="snakeStart">Start / Neustart</button><button class="secondary" id="snakePause">Pause</button></div>`);const canvas=$('#snakeCanvas'),ctx=canvas.getContext('2d');let body,dir,next,food,score,running=false,paused=false,timer=null,best=0;try{best=Number(localStorage.getItem('ph_snake_best'))||0}catch{}$('#best').textContent=best;function freeFood(){const cells=[];for(let y=0;y<20;y++)for(let x=0;x<20;x++)if(!body.some(s=>s.x===x&&s.y===y))cells.push({x,y});return cells.length?cells[Math.floor(Math.random()*cells.length)]:null}function draw(){ctx.fillStyle='#091a22';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#17303a';for(let i=0;i<=20;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,400);ctx.moveTo(0,i*20);ctx.lineTo(400,i*20);ctx.stroke()}if(food){ctx.fillStyle='#ff687a';ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);ctx.fill()}body.forEach((s,i)=>{ctx.fillStyle=i?'#49b889':'#86ffd0';ctx.fillRect(s.x*20+2,s.y*20+2,16,16)})}function init(){clearInterval(timer);body=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next=dir;food=freeFood();score=0;running=true;paused=false;$('#score').textContent=0;$('#snakeStatus').textContent='Los geht’s!';draw();timer=setInterval(tick,125)}function end(msg){running=false;clearInterval(timer);$('#snakeStatus').textContent=msg+' Punkte: '+score}function tick(){if(!running||paused)return;dir=next;const h={x:body[0].x+dir.x,y:body[0].y+dir.y},eat=food&&h.x===food.x&&h.y===food.y;const collide=body.slice(0,eat?body.length:body.length-1).some(s=>s.x===h.x&&s.y===h.y);if(h.x<0||h.y<0||h.x>=20||h.y>=20||collide){end('Game Over!');return}body.unshift(h);if(eat){score++;$('#score').textContent=score;if(score>best){best=score;$('#best').textContent=best;try{localStorage.setItem('ph_snake_best',best)}catch{}}food=freeFood();if(!food){draw();end('Gewonnen!');return}}else body.pop();draw()}function steer(d){if(!running||paused)return;const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const a=dirs[d];if(a&&!(a.x===-dir.x&&a.y===-dir.y))next=a}function keys(e){const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();steer(map[e.key])}if(e.code==='Space'){e.preventDefault();$('#snakePause').click()}}document.addEventListener('keydown',keys);let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)steer(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});area.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>steer(b.dataset.dir));$('#snakeStart').onclick=init;$('#snakePause').onclick=()=>{if(!running)return;paused=!paused;$('#snakeStatus').textContent=paused?'Pausiert':'Los geht’s!';$('#snakePause').textContent=paused?'Weiter':'Pause'};body=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];food={x:13,y:10};draw();cleanup=()=>{clearInterval(timer);document.removeEventListener('keydown',keys)}}
function tic(){shell('⭕ Tic Tac Toe','Du spielst X, der Computer spielt O.',`<div class="stats"><div class="stat" id="tttStatus">Du bist dran (X)</div></div><div class="ttt-board" id="tttBoard"></div><div class="actions"><button class="primary" id="tttReset">Neues Spiel</button></div>`);let cells,done;const board=$('#tttBoard'),status=$('#tttStatus');function result(a){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const w of wins)if(a[w[0]]&&a[w[0]]===a[w[1]]&&a[w[1]]===a[w[2]])return a[w[0]];return a.every(Boolean)?'draw':null}function render(){board.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v||'';b.className=v==='O'?'o':'';b.setAttribute('aria-label','Feld '+(i+1)+(v?' '+v:''));b.disabled=!!v||done;b.onclick=()=>{cells[i]='X';advance();if(!done){status.textContent='Computer denkt ...';setTimeout(()=>{if(done||!play.classList.contains('active'))return;const empty=cells.map((v,i)=>v?-1:i).filter(i=>i>=0);let move=null;for(const mark of ['O','X']){for(const j of empty){const test=[...cells];test[j]=mark;if(result(test)===mark){move=j;break}}if(move!==null)break}if(move===null)move=cells[4]===null?4:empty[Math.floor(Math.random()*empty.length)];cells[move]='O';advance()},350)} };board.appendChild(b)})}function advance(){const r=result(cells);if(r){done=true;status.textContent=r==='draw'?'Unentschieden!':r==='X'?'🎉 Du hast gewonnen!':'Computer hat gewonnen.'}else status.textContent='Du bist dran (X)';render()}function reset(){cells=Array(9).fill(null);done=false;status.textContent='Du bist dran (X)';render()}$('#tttReset').onclick=reset;reset()}
function memory(){shell('🧠 Memory','Drehe Karten um und finde alle 8 Paare.',`<div class="stats"><div class="stat">Versuche: <b id="moves">0</b></div><div class="stat">Paare: <b id="pairs">0 / 8</b></div></div><div class="memory-board" id="memoryBoard"></div><p class="muted" id="memoryStatus">Viel Erfolg!</p><div class="actions"><button class="primary" id="memoryReset">Neu mischen</button></div>`);const board=$('#memoryBoard');let cards,shown=[],matched=new Set(),moves=0,lock=false,flipTimer;function render(){board.innerHTML='';cards.forEach((v,i)=>{const visible=shown.includes(i)||matched.has(i);const b=document.createElement('button');b.textContent=visible?v:'?';b.className=matched.has(i)?'matched':visible?'':'hidden-card';b.setAttribute('aria-label',visible?'Karte '+v:'Verdeckte Karte');b.disabled=matched.has(i)||shown.includes(i)||lock;b.onclick=()=>{if(lock)return;shown.push(i);render();if(shown.length===2){moves++;$('#moves').textContent=moves;const [a,z]=shown;if(cards[a]===cards[z]){matched.add(a);matched.add(z);shown=[];$('#pairs').textContent=matched.size/2+' / 8';if(matched.size===16)$('#memoryStatus').textContent='🎉 Geschafft in '+moves+' Versuchen!';render()}else{lock=true;flipTimer=setTimeout(()=>{shown=[];lock=false;render()},750)}}};board.appendChild(b)})}function reset(){clearTimeout(flipTimer);const symbols=['🍕','🚀','🐶','🎮','⚽','🌈','⭐','🍉'];cards=[...symbols,...symbols];for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}shown=[];matched=new Set();moves=0;lock=false;$('#moves').textContent=0;$('#pairs').textContent='0 / 8';$('#memoryStatus').textContent='Viel Erfolg!';render()}$('#memoryReset').onclick=reset;reset();cleanup=()=>clearTimeout(flipTimer)}
function click(){shell('⚡ Click Challenge','Klicke so schnell du kannst – du hast 10 Sekunden.',`<div class="stats"><div class="stat">Zeit: <b id="time">10.0 s</b></div><div class="stat">Klicks: <b id="clicks">0</b></div></div><div class="target"><button id="tap" aria-label="Schnell klicken" disabled>⚡</button></div><p id="clickStatus" class="muted">Starte die Challenge!</p><div class="actions"><button class="primary" id="clickStart">Start / Neustart</button></div>`);let count=0,end=0,timer=null,active=false;const tap=$('#tap'),status=$('#clickStatus');function finish(){active=false;tap.disabled=true;clearInterval(timer);$('#time').textContent='0.0 s';status.textContent='Geschafft! '+count+' Klicks in 10 Sekunden.'}function start(){clearInterval(timer);count=0;$('#clicks').textContent=0;$('#time').textContent='10.0 s';status.textContent='Jetzt klicken!';tap.disabled=false;active=true;end=performance.now()+10000;timer=setInterval(()=>{const remain=Math.max(0,(end-performance.now())/1000);$('#time').textContent=remain.toFixed(1)+' s';if(remain<=0)finish()},40)}tap.onclick=()=>{if(!active)return;if(performance.now()>=end){finish();return}count++;$('#clicks').textContent=count};$('#clickStart').onclick=start;cleanup=()=>clearInterval(timer)}

function guess(){let secret,tries,history,won; shell('🔢 Zahlenraten','Errate eine Zahl zwischen 1 und 100.',`<div class="stats"><div class="stat">Versuche: <b id="tries">0</b></div></div><input id="guessInput" class="search" type="number" min="1" max="100" placeholder="Dein Tipp" style="max-width:250px"><div class="actions"><button class="primary" id="guessGo">Prüfen</button><button class="secondary" id="guessReset">Neue Zahl</button></div><p id="guessStatus" class="muted" aria-live="polite"></p><h3>Deine bisherigen Zahlen</h3><div id="guessHistory" style="display:flex;flex-wrap:wrap;gap:8px" aria-live="polite"></div>`);function reset(){secret=1+Math.floor(Math.random()*100);tries=0;history=[];won=false;$('#tries').textContent=0;$('#guessHistory').innerHTML='';$('#guessStatus').textContent='Viel Glück!';$('#guessInput').value=''}$('#guessGo').onclick=()=>{if(won)return;const raw=$('#guessInput').value,n=Number(raw);if(!raw||!Number.isInteger(n)||n<1||n>100){$('#guessStatus').textContent='Bitte eine Zahl von 1 bis 100 eingeben.';return}if(history.includes(n)){$('#guessStatus').textContent='Die Zahl '+n+' hast du schon versucht!';return}history.push(n);tries++;$('#tries').textContent=tries;const chip=document.createElement('span');chip.className='stat';chip.textContent=n+(n===secret?' ✓':n<secret?' ↑':' ↓');$('#guessHistory').appendChild(chip);won=n===secret;$('#guessStatus').textContent=won?'🎉 Richtig! In '+tries+' Versuchen.':n<secret?'⬆️ Höher!':'⬇️ Tiefer!';$('#guessInput').value='';$('#guessInput').focus()};$('#guessReset').onclick=reset;$('#guessInput').onkeydown=e=>{if(e.key==='Enter')$('#guessGo').click()};reset()}
function rps(){
shell('✊ Schere Stein Papier','Wähle deine Hand und sieh dir das Duell an.',`<div class="stats"><div class="stat">Du: <b id="rWins">0</b></div><div class="stat">Computer: <b id="rLoss">0</b></div></div><div class="duel"><div><div class="duel-hand" id="rYou">✊</div><small>Du</small></div><b>VS</b><div><div class="duel-hand mirrored" id="rCpu">✊</div><small>Computer</small></div></div><div class="actions" id="rChoices"><button class="primary" data-pick="0">✊ Stein</button><button class="primary" data-pick="1">✋ Papier</button><button class="primary" data-pick="2">✌️ Schere</button></div><p id="rStatus" class="muted" aria-live="polite">Wähle deine Hand!</p>`);
let w=0,l=0,busy=false,timer=null;
const names=['Stein','Papier','Schere'],emoji=['✊','✋','✌️'],buttons=[...area.querySelectorAll('[data-pick]')];
buttons.forEach(b=>b.onclick=()=>{
if(busy)return;
busy=true;buttons.forEach(x=>x.disabled=true);
const a=Number(b.dataset.pick),c=Math.floor(Math.random()*3);
$('#rStatus').textContent='Schere … Stein … Papier!';
$('#rYou').textContent='✊';$('#rCpu').textContent='✊';
$('#rYou').classList.add('shaking');$('#rCpu').classList.add('shaking');
timer=setTimeout(()=>{
$('#rYou').classList.remove('shaking');$('#rCpu').classList.remove('shaking');
$('#rYou').textContent=emoji[a];$('#rCpu').textContent=emoji[c];
const d=(a-c+3)%3;if(d===1)w++;if(d===2)l++;
$('#rWins').textContent=w;$('#rLoss').textContent=l;
$('#rStatus').textContent='Du: '+names[a]+' · Computer: '+names[c]+' — '+(d===0?'Unentschieden!':d===1?'🎉 Gewonnen!':'Computer gewinnt!');
busy=false;buttons.forEach(x=>x.disabled=false);

function reaction(){shell('🎯 Reaktionstest','Drücke Start, warte auf GRÜN und klicke dann so schnell wie möglich.',`<div class="target" id="reactZone" style="cursor:pointer;user-select:none;font-size:24px;font-weight:bold">Bereit?</div><p class="muted" id="reactStatus">Teste deine Reaktion.</p><div class="actions"><button class="primary" id="reactStart">Start</button></div>`);let state='idle',timer=null,at=0;const z=$('#reactZone');$('#reactStart').onclick=()=>{clearTimeout(timer);state='wait';z.style.background='#693041';z.textContent='Warten ...';$('#reactStatus').textContent='Noch nicht klicken!';timer=setTimeout(()=>{state='go';at=performance.now();z.style.background='#18754c';z.textContent='JETZT KLICKEN!'},1500+Math.random()*2500)};z.onclick=()=>{if(state==='wait'){clearTimeout(timer);state='idle';z.textContent='Zu früh!';$('#reactStatus').textContent='Starte einen neuen Versuch.'}else if(state==='go'){const ms=Math.round(performance.now()-at);state='idle';z.textContent=ms+' ms';$('#reactStatus').textContent='Deine Reaktionszeit: '+ms+' Millisekunden.'}};cleanup=()=>clearTimeout(timer)}
function math(){shell('🧮 Mathe Blitz','Löse 10 zufällige Aufgaben.',`<div class="stats"><div class="stat">Aufgabe: <b id="mathRound">1 / 10</b></div><div class="stat">Richtig: <b id="mathScore">0</b></div></div><h2 id="mathQuestion"></h2><input class="search" id="mathInput" type="number" placeholder="Antwort" style="max-width:230px"><div class="actions"><button class="primary" id="mathCheck">Antwort prüfen</button><button class="secondary" id="mathReset">Neustart</button></div><p class="muted" id="mathStatus"></p>`);let round,score,answer,finished;function next(){if(round>10){finished=true;$('#mathQuestion').textContent='🎉 Fertig!';$('#mathStatus').textContent=score+' von 10 richtig!';return}const a=1+Math.floor(Math.random()*20),b=1+Math.floor(Math.random()*20),plus=Math.random()<.5;answer=plus?a+b:a-b;$('#mathQuestion').textContent=a+(plus?' + ':' − ')+b+' = ?';$('#mathRound').textContent=round+' / 10';$('#mathInput').value='';$('#mathInput').focus()}function reset(){round=1;score=0;finished=false;$('#mathScore').textContent=0;$('#mathStatus').textContent='';next()}$('#mathCheck').onclick=()=>{if(finished||$('#mathInput').value.trim()==='')return;if(Number($('#mathInput').value)===answer){score++;$('#mathScore').textContent=score;$('#mathStatus').textContent='✅ Richtig!'}else $('#mathStatus').textContent='❌ Die richtige Antwort war '+answer;round++;next()};$('#mathInput').onkeydown=e=>{if(e.key==='Enter')$('#mathCheck').click()};$('#mathReset').onclick=reset;reset()}
function whack(){shell('🐹 Maulwurf-Jagd','Triff so viele Maulwürfe wie möglich in 30 Sekunden.',`<div class="stats"><div class="stat">Punkte: <b id="whScore">0</b></div><div class="stat">Zeit: <b id="whTime">30</b>s</div></div><div id="whBoard" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:20px auto"></div><div class="actions"><button class="primary" id="whStart">Start / Neustart</button></div><p id="whStatus" class="muted">Bereit?</p>`);let score=0,active=false,target=-1,interval=null,clock=null,remaining=30;const board=$('#whBoard');for(let i=0;i<9;i++){const b=document.createElement('button');b.style.cssText='aspect-ratio:1;border-radius:16px;background:#263951;border:1px solid #49627b;font-size:45px;color:white';b.textContent='🕳️';b.onclick=()=>{if(!active||i!==target)return;score++;$('#whScore').textContent=score;target=-1;draw()};board.appendChild(b)}function draw(){[...board.children].forEach((b,i)=>b.textContent=i===target?'🐹':'🕳️')}function stop(){active=false;clearInterval(interval);clearInterval(clock);target=-1;draw();$('#whStatus').textContent='Geschafft! '+score+' Punkte.'}$('#whStart').onclick=()=>{clearInterval(interval);clearInterval(clock);score=0;remaining=30;active=true;$('#whScore').textContent=0;$('#whTime').textContent=30;$('#whStatus').textContent='Los geht’s!';target=Math.floor(Math.random()*9);draw();interval=setInterval(()=>{target=Math.floor(Math.random()*9);draw()},750);clock=setInterval(()=>{remaining--;$('#whTime').textContent=remaining;if(remaining<=0)stop()},1000)};cleanup=()=>{clearInterval(interval);clearInterval(clock)}}
function color(){
shell('🎨 Farben-Match','Finde die genannte Farbe, bevor die Zeit abläuft.',`<div class="actions"><label for="colorLevel">Schwierigkeit:</label><select id="colorLevel" class="search" style="max-width:220px"><option value="10">Einfach – 10 Sekunden</option><option value="5">Normal – 5 Sekunden</option><option value="2">Schwer – 2 Sekunden</option></select></div><div class="stats"><div class="stat">Richtig: <b id="colorScore">0</b></div><div class="stat">Zeit: <b id="colorTime">10.0</b> s</div><div class="stat">Verpasst: <b id="colorMiss">0</b></div></div><h2 id="colorPrompt"></h2><div class="actions" id="colorChoices"></div><p id="colorStatus" class="muted" aria-live="polite">Wähle die passende Farbe.</p><div class="actions"><button class="secondary" id="colorReset">Neustart</button></div>`);
const opts=[['Rot','#e35d6a'],['Blau','#4e96ee'],['Grün','#40bc84'],['Gelb','#eac65b']];
let score=0,miss=0,target=0,deadline=0,timer=null,round=0;
function next(){
clearInterval(timer);round++;const current=round;
target=Math.floor(Math.random()*4);
$('#colorPrompt').textContent='Finde: '+opts[target][0];
const order=[0,1,2,3].sort(()=>Math.random()-.5);
$('#colorChoices').innerHTML='';
order.forEach(i=>{
const b=document.createElement('button');b.className='secondary';
b.style.cssText='background:'+opts[i][1]+';color:#101827;min-width:90px;font-weight:bold';
b.textContent=opts[i][0];b.onclick=()=>{
if(current!==round)return;
if(i===target){score++;$('#colorScore').textContent=score;$('#colorStatus').textContent='✅ Richtig!'}
else{miss++;$('#colorMiss').textContent=miss;$('#colorStatus').textContent='❌ Falsche Farbe!'}
next();
};$('#colorChoices').appendChild(b);
});
deadline=performance.now()+Number($('#colorLevel').value)*1000;
function tick(){
if(current!==round)return;
const remaining=Math.max(0,(deadline-performance.now())/1000);
$('#colorTime').textContent=remaining.toFixed(1);
if(remaining<=0){miss++;$('#colorMiss').textContent=miss;$('#colorStatus').textContent='⏰ Zeit abgelaufen!';next()}
}
tick();timer=setInterval(tick,50);
}
function reset(){score=0;miss=0;$('#colorScore').textContent=0;$('#colorMiss').textContent=0;$('#colorStatus').textContent='Los geht’s!';next()}
$('#colorLevel').onchange=reset;$('#colorReset').onclick=reset;
cleanup=()=>clearInterval(timer);
reset();
}

function words(){
const pool=['VOLLEYBALL','COMPUTER','ABENTEUER','FAHRRAD','SCHOKOLADE','SONNENSCHEIN','RAKETE','WASSERFALL','GEHEIMNIS','DINOSAURIER','MOTORRAD','SPIELPLATZ','BIBLIOTHEK','WOLKENKRATZER','KOPFHOERER','ZAUBEREI','FERIEN','SCHMETTERLING'];
shell('🔤 Wörter erraten','Errate das geheime Wort. Du hast maximal 7 falsche Versuche.',`<div class="stats"><div class="stat">Fehlversuche: <b id="wordTries">0</b> / 7</div></div><h2 id="wordSlots" style="letter-spacing:6px;overflow-wrap:anywhere"></h2><div id="wordKeys" style="display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:560px;margin:20px auto"></div><p id="wordStatus" class="muted" aria-live="polite"></p><div class="actions"><button class="secondary" id="wordReset">Neues Wort</button></div>`);
let word,used,miss,done;
function draw(){const shown=[...word].map(c=>used.has(c)?c:'_').join(' ');$('#wordSlots').textContent=shown;$('#wordTries').textContent=miss;const won=[...word].every(c=>used.has(c));if(won||miss>=7){done=true;$('#wordStatus').textContent=won?'🎉 Du hast das Wort erraten!':'Leider verloren. Das Wort war: '+word}}
function choose(c){if(done||used.has(c))return;used.add(c);if(!word.includes(c))miss++;const b=area.querySelector('[data-letter="'+c+'"]');if(b)b.disabled=true;draw()}
function reset(){word=pool[Math.floor(Math.random()*pool.length)];used=new Set();miss=0;done=false;$('#wordStatus').textContent='Wähle einen Buchstaben.';$('#wordKeys').innerHTML='';for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){const b=document.createElement('button');b.className='secondary';b.textContent=c;b.dataset.letter=c;b.style.minWidth='39px';b.onclick=()=>choose(c);$('#wordKeys').appendChild(b)}draw()}
$('#wordReset').onclick=reset;
const key=e=>{const c=e.key.toUpperCase();if(/^[A-Z]$/.test(c)&&e.key.length===1)choose(c)};
document.addEventListener('keydown',key);cleanup=()=>document.removeEventListener('keydown',key);reset();
}
function car(){
shell('🏎️ Auto-Ausweichen','Weiche den anderen Autos aus. Steuere mit ← → oder A/D. Auf dem Handy mit den Buttons.',`<div class="stats"><div class="stat">Punkte: <b id="carScore">0</b></div><div class="stat">Rekord: <b id="carBest">0</b></div></div><canvas id="carCanvas" width="320" height="440" style="display:block;width:min(100%,320px);height:auto;margin:15px auto;border-radius:14px;background:#182538;touch-action:none"></canvas><div class="actions"><button class="secondary" id="carLeft">⬅️ Links</button><button class="primary" id="carStart">Start / Neustart</button><button class="secondary" id="carRight">Rechts ➡️</button></div><p class="muted" id="carStatus">Drücke Start.</p>`);
const canvas=$('#carCanvas'),ctx=canvas.getContext('2d');let lane=1,obstacles=[],score=0,best=0,running=false,raf=0,last=0,spawn=0;
function draw(){ctx.fillStyle='#1d2939';ctx.fillRect(0,0,320,440);ctx.fillStyle='#4b5563';ctx.fillRect(25,0,270,440);ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.setLineDash([22,20]);for(let x of [115,205]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,440);ctx.stroke()}ctx.setLineDash([]);for(const o of obstacles){ctx.fillStyle='#ef646c';ctx.fillRect(52+o.lane*90,o.y,45,68);ctx.fillStyle='#ffd5d5';ctx.fillRect(58+o.lane*90,o.y+9,33,13)}ctx.fillStyle='#52d3aa';ctx.fillRect(52+lane*90,345,45,70);ctx.fillStyle='#c4fff0';ctx.fillRect(58+lane*90,357,33,15)}
function move(dir){if(running)lane=Math.max(0,Math.min(2,lane+dir))}
const key=e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'?-1:1)}};
document.addEventListener('keydown',key);$('#carLeft').onclick=()=>move(-1);$('#carRight').onclick=()=>move(1);
function frame(t){if(!running)return;const dt=Math.min((t-last)/1000,.05);last=t;spawn+=dt;const speed=170+Math.min(score*1.8,200);if(spawn>Math.max(.52,1.12-score*.003)){spawn=0;obstacles.push({lane:Math.floor(Math.random()*3),y:-75,passed:false})}for(const o of obstacles){o.y+=speed*dt;if(!o.passed&&o.y>440){o.passed=true;score+=10;$('#carScore').textContent=score}if(o.lane===lane&&o.y+68>345&&o.y<415){running=false;$('#carStatus').textContent='💥 Game Over! '+score+' Punkte. Starte neu.';if(score>best){best=score;$('#carBest').textContent=best}draw();return}}obstacles=obstacles.filter(o=>o.y<500);draw();raf=requestAnimationFrame(frame)}
$('#carStart').onclick=()=>{cancelAnimationFrame(raf);lane=1;obstacles=[];score=0;spawn=0;running=true;last=performance.now();$('#carScore').textContent=0;$('#carStatus').textContent='Fahre vorsichtig!';raf=requestAnimationFrame(frame)};
cleanup=()=>{running=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',key)};draw();
}
})();
</script></body></html>
